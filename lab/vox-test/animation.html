<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vox look test — la boîte</title>
<style>
  @font-face { font-family: ArchivoBlack; src: url(fonts/ArchivoBlack.ttf); }
  @font-face { font-family: JBMono; src: url(fonts/JetBrainsMono.ttf); }
  html,body { margin:0; background:#111; }
  canvas { display:block; width:100vw; height:auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ------------------------------------------------------------------ setup
const W = 1920, H = 1080, DUR = 8;
const C = { paper:'#EFC65A', paper2:'#E4B94B', cream:'#F5EDDC', navy:'#16233D', coral:'#E4572E', ink:'#17130F' };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;

const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => { t = clamp(t); return t*t*(3-2*t); };
const out = t => 1 - Math.pow(1-clamp(t), 3);
const back = t => { t = clamp(t); const c = 1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const prog = (t, at, dur) => clamp((t-at)/dur);
const alpha = (t, at, dur) => smooth(prog(t, at, dur));

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

// ------------------------------------------------------------------ textures
const grain = document.createElement('canvas'); grain.width = 960; grain.height = 540;
{
  const g = grain.getContext('2d'), id = g.createImageData(960, 540);
  const r = rng(7);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 110 + r() * 90;
    id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 30 + r() * 30;
  }
  g.putImageData(id, 0, 0);
}

const halftone = document.createElement('canvas'); halftone.width = halftone.height = 16;
{
  const g = halftone.getContext('2d');
  g.fillStyle = '#000'; g.beginPath(); g.arc(8, 8, 3.1, 0, TAU); g.fill();
}
const dotPat = ctx.createPattern(halftone, 'repeat');

// ------------------------------------------------------------------ torn paper paths
function tornPath(x, y, w, h, seed, jag = 14) {
  const r = rng(seed), p = new Path2D(), step = 26;
  const pts = [];
  const edge = (x0,y0,x1,y1) => {
    const n = Math.max(2, Math.round(Math.hypot(x1-x0, y1-y0)/step));
    for (let i = 0; i < n; i++) {
      const k = i/n, j = (r()-.5)*jag;
      pts.push([lerp(x0,x1,k) + (y1===y0 ? 0 : j), lerp(y0,y1,k) + (y1===y0 ? j : 0)]);
    }
  };
  edge(x,y,x+w,y); edge(x+w,y,x+w,y+h); edge(x+w,y+h,x,y+h); edge(x,y+h,x,y);
  pts.forEach(([px,py], i) => i ? p.lineTo(px,py) : p.moveTo(px,py));
  p.closePath();
  return p;
}

// ------------------------------------------------------------------ assets
const ship = new Image(); ship.src = 'assets/ship-crop.jpg';
const FONTS = [
  new FontFace('ArchivoBlack', 'url(fonts/ArchivoBlack.ttf)'),
  new FontFace('JBMono', 'url(fonts/JetBrainsMono.ttf)'),
];
window.READY = Promise.all([...FONTS.map(f => f.load().then(l => document.fonts.add(l))), new Promise(r => { if (ship.complete) r(); else ship.onload = r; })]);

// ------------------------------------------------------------------ helpers
function text(str, x, y, { size=120, font='ArchivoBlack', color=C.ink, track='-0.03em', align='left', alpha:a=1, shadow=0 } = {}) {
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = `${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.letterSpacing = track;
  ctx.fillStyle = color;
  if (shadow) { ctx.shadowColor = 'rgba(20,17,15,.45)'; ctx.shadowBlur = shadow; ctx.shadowOffsetY = shadow*.35; }
  ctx.fillText(str, x, y);
  ctx.restore();
}

// ------------------------------------------------------------------ scene
function paperBase(t) {
  ctx.fillStyle = C.paper; ctx.fillRect(0,0,W,H);
  // halftone field, slowly drifting
  ctx.save();
  ctx.globalAlpha = .055; ctx.fillStyle = dotPat;
  ctx.translate((t*5)%16, (t*3)%16);
  ctx.fillRect(-16,-16,W+32,H+32);
  ctx.restore();
  // grain
  ctx.save();
  ctx.globalAlpha = .5; ctx.globalCompositeOperation = 'soft-light';
  const ox = (t*17)%40, oy = (t*11)%40;
  ctx.drawImage(grain, -ox, -oy, W+80, H+80);
  ctx.restore();
  // vignette
  const v = ctx.createRadialGradient(W*.48,H*.45,H*.35,W*.5,H*.5,H*.95);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(60,35,0,.22)');
  ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}

function tornCircle(cx, cy, r, seed, jag = 8) {
  const p = new Path2D(), rnd = rng(seed), n = 110;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU, rr = r + (rnd() - .5) * jag;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

function creamDisc(t) {
  const p = prog(t, .12, .75), s = lerp(.82, 1, back(p)), a = alpha(t,.12,.5);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(1500, 215); ctx.scale(s,s);
  ctx.fillStyle = C.cream;
  ctx.shadowColor = 'rgba(60,35,0,.25)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 22;
  ctx.fill(tornCircle(0, 0, 300, 11, 9));
  ctx.restore();
}

function navyBand(t) {
  const p = out(prog(t, .22, .7));
  if (p <= 0) return;
  ctx.save();
  ctx.translate(0, lerp(340, 0, p));
  ctx.rotate(-1.6 * Math.PI/180);
  ctx.fillStyle = C.navy;
  ctx.fill(tornPath(-120, 690, W+240, 520, 23, 18));
  ctx.restore();
}

function headline(t) {
  const lines = [
    { s:'LE MONDE',   size:172, y:300, at:.55, x:110, color:C.ink },
    { s:'TIENT DANS', size:96,  y:404, at:.75, x:116, color:C.ink },
    { s:'UNE BOÎTE',  size:172, y:556, at:.95, x:110, color:C.coral },
  ];
  for (const l of lines) {
    const p = back(prog(t, l.at, .55)), a = alpha(t, l.at, .35);
    if (a <= 0) continue;
    ctx.save();
    ctx.translate(0, (1-p)*80);
    text(l.s, l.x, l.y, { size:l.size, color:l.color, alpha:a });
    ctx.restore();
  }
  // marker circle around line 3
  const p = prog(t, 3.3, .9);
  if (p > 0) {
    ctx.save();
    ctx.translate(560, 498); ctx.rotate(-1.4*Math.PI/180);
    ctx.strokeStyle = C.ink; ctx.lineCap = 'round';
    for (let pass = 0; pass < 2; pass++) {
      const r = rng(40 + pass * 9);
      const rx = 510 + pass*7, ry = 82 + pass*4;
      const n = Math.ceil(140 * p);
      ctx.globalAlpha = .92 - pass*.34;
      ctx.lineWidth = 7.5 - pass*2.5;
      ctx.beginPath();
      for (let i = 0; i <= n; i++) {
        const a0 = -2.62 + (i/140) * TAU * 1.01;
        const wob = Math.sin(i*.9 + pass)*2.6 + (r()-.5)*2;
        const x = Math.cos(a0)*(rx+wob), y = Math.sin(a0)*(ry+wob*.5);
        i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}

function labelStrip(t) {
  const p = out(prog(t, 1.15, .55)), a = alpha(t,1.15,.3);
  if (p <= 0) return;
  ctx.save();
  ctx.translate(lerp(-520, 0, p), 0);
  ctx.globalAlpha = a;
  ctx.rotate(.7*Math.PI/180);
  ctx.fillStyle = C.cream;
  ctx.shadowColor = 'rgba(60,35,0,.22)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
  ctx.fill(tornPath(108, 640, 590, 62, 31, 5));
  ctx.shadowColor = 'transparent';
  text('90 % DU COMMERCE MONDIAL', 142, 683, { size:26, font:'JBMono', color:C.ink, track:'.06em' });
  ctx.restore();
}

function shipPrint(t) {
  const p = back(prog(t, 1.35, .85)), a = alpha(t, 1.35, .5);
  if (a <= 0) return;
  const w = 1160, h = w * 360/900;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(lerp(W+380, 780, p), lerp(760, 520, p));
  ctx.rotate(-3.5 * Math.PI/180);
  // paper border + shadow
  ctx.shadowColor = 'rgba(20,17,15,.42)'; ctx.shadowBlur = 46; ctx.shadowOffsetY = 20; ctx.shadowOffsetX = 6;
  ctx.fillStyle = C.cream;
  ctx.fillRect(-22, -22, w+44, h+44);
  ctx.shadowColor = 'transparent';
  // photo
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,w,h); ctx.clip();
  ctx.filter = 'saturate(.86) contrast(1.06) brightness(1.02)';
  ctx.drawImage(ship, 0, 0, w, h);
  ctx.filter = 'none';
  // halftone over the photo
  ctx.globalAlpha = .38; ctx.fillStyle = dotPat; ctx.fillRect(0,0,w,h);
  ctx.globalAlpha = .10; ctx.fillStyle = C.paper; ctx.fillRect(0,0,w,h);
  ctx.restore();
  ctx.restore();
}

function containers(t) {
  const at = 4.55, cols = [C.coral, C.cream, C.paper2, C.ink];
  for (let i = 0; i < 4; i++) {
    const p = back(prog(t, at + i*.13, .45)), a = alpha(t, at + i*.13, .25);
    if (a <= 0) continue;
    const x = 118 + (i%2)*136, y = 1010 - Math.floor(i/2)*78 - i*2;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(x + 68, y - 36); ctx.scale(lerp(.6,1,p), lerp(.6,1,p)); ctx.translate(-68, 36);
    ctx.fillStyle = cols[i];
    ctx.shadowColor = 'rgba(20,17,15,.35)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
    ctx.fillRect(0, 0, 128, 66);
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(245,237,220,.35)'; ctx.lineWidth = 2;
    for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(k*32, 8); ctx.lineTo(k*32, 58); ctx.stroke(); }
    ctx.restore();
  }
}

function caption(t) {
  const p = out(prog(t, 5.5, .5)), a = alpha(t,5.5,.3);
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(lerp(120, 0, p), 0);
  ctx.fillStyle = C.cream;
  ctx.fill(tornPath(1330, 986, 470, 54, 51, 5));
  text('1956 · LE CONTENEUR', 1362, 1022, { size:24, font:'JBMono', color:C.ink, track:'.08em' });
  ctx.restore();
}

function dust(t) {
  const r = rng(99);
  ctx.save();
  for (let i = 0; i < 26; i++) {
    const x = r()*W, y = r()*H, s = .6 + r()*1.8, ph = r()*TAU, sp = .3 + r()*.7;
    ctx.globalAlpha = .10 + .10*Math.sin(t*sp + ph);
    ctx.fillStyle = r() > .5 ? C.cream : C.ink;
    ctx.beginPath(); ctx.arc((x + Math.sin(t*.4+ph)*26 + t*6) % W, y + Math.cos(t*.3+ph)*18, s, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function pageNo(t) {
  text('01 / 08', W-70, 74, { size:24, font:'JBMono', color:C.ink, track:'.1em', align:'right', alpha:.55 });
}

// ------------------------------------------------------------------ camera + frame
function draw(t) {
  ctx.save();
  const k = 1 + .055 * smooth(t/DUR);
  // push-in around a point left of centre so the type stays put
  const cx = W*.52, cy = H*.46;
  ctx.translate(W/2, H/2); ctx.scale(k,k); ctx.translate(-W/2, -H/2);
  ctx.translate(-18 * smooth(t/DUR), 0);

  paperBase(t);
  creamDisc(t);
  navyBand(t);
  shipPrint(t);
  headline(t);
  labelStrip(t);
  containers(t);
  caption(t);
  dust(t);
  pageNo(t);
  ctx.restore();

  // global print finish
  ctx.save();
  ctx.globalAlpha = .045; ctx.fillStyle = dotPat;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

window.setT = t => { draw(t); };
window.SPEC = { duration: DUR, fps: 30 };
draw(0);
</script>
</body>
</html>
