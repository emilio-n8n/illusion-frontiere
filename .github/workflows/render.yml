name: render

on:
  workflow_dispatch:
    inputs:
      blocks:
        description: "all, or a comma-separated list (B00,B01,...)"
        required: true
        default: "all"
      dir:
        description: "blocks (visual proof) or narration (animatic)"
        required: true
        default: "blocks"
      scale:
        description: "1 = 1920x1080, 0.5 = 960x540 preview"
        required: true
        default: "1"
      preset:
        description: "x264 preset"
        required: true
        default: "medium"
      crf:
        description: "x264 CRF (lower = better)"
        required: true
        default: "18"
      partial:
        description: "true = concatenate only the rendered blocks"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          if [ "${{ inputs.blocks }}" = "all" ]; then
            value="$(node studio/list_blocks.mjs --dir "${{ inputs.dir }}")"
          else
            value="$(node -e "console.log(JSON.stringify('${{ inputs.blocks }}'.split(',').map(s => s.trim()).filter(Boolean)))")"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        block: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Render ${{ matrix.block }}
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "render attempt $attempt for ${{ matrix.block }}"
            node studio/render_block.mjs \
              --block "${{ matrix.block }}" \
              --dir "${{ inputs.dir }}" \
              --out "out/${{ inputs.dir }}/${{ matrix.block }}.mp4" \
              --scale "${{ inputs.scale }}" \
              --preset "${{ inputs.preset }}" \
              --crf "${{ inputs.crf }}" && exit 0
            echo "attempt $attempt failed"
            sleep 5
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: block-${{ matrix.block }}
          path: out/${{ inputs.dir }}/${{ matrix.block }}.mp4
          if-no-files-found: error
          retention-days: 7

  join:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/download-artifact@v4
        with:
          pattern: block-*
          merge-multiple: true
          path: out/${{ inputs.dir }}

      - name: Concatenate
        shell: bash
        run: |
          extra=""
          if [ "${{ inputs.partial }}" = "true" ]; then extra="--allow-missing"; fi
          node studio/concat.mjs --dir "${{ inputs.dir }}" --out out/film-silent.mp4 $extra

      - uses: actions/upload-artifact@v4
        with:
          name: film-silent
          path: out/film-silent.mp4
          if-no-files-found: error
          retention-days: 7
