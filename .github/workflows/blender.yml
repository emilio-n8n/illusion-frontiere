name: blender

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "scene file under blender/ (without .py)"
        required: true
        default: "neural_net"
      frames:
        description: "total frames"
        required: true
        default: "144"
      chunks:
        description: "parallel jobs to split the frame range into"
        required: true
        default: "8"
      res:
        description: "resolution percentage (100 = 1080p)"
        required: true
        default: "100"
      samples:
        description: "EEVEE TAA samples"
        required: true
        default: "64"
      engine:
        description: "eevee or cycles"
        required: true
        default: "eevee"
      args:
        description: "extra scene args, e.g. --image X --depth Y --move push-in"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        shell: bash
        run: |
          python3 - <<'PY' > chunk_matrix.json
          import json, math
          frames = int("${{ inputs.frames }}")
          chunks = max(1, int("${{ inputs.chunks }}"))
          size = math.ceil(frames / chunks)
          matrix = []
          c = 0; s = 1
          while s <= frames:
              e = min(frames, s + size - 1)
              matrix.append({"chunk": c, "start": s, "end": e})
              s = e + 1; c += 1
          print(json.dumps(matrix))
          PY
          echo "matrix=$(cat chunk_matrix.json)" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        part: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender tarball
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/blender
          key: blender-5.2.1

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/blender
          curl -L --retry 3 -o ~/.cache/blender/blender-5.2.1.tar.xz \
            https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz

      - name: Extract Blender
        run: |
          mkdir -p /tmp/blender
          tar -xJf ~/.cache/blender/blender-5.2.1.tar.xz -C /tmp/blender --strip-components=1
          echo "/tmp/blender" >> "$GITHUB_PATH"
          blender --version | head -1

      - name: Install system deps (GL/EGL for headless EEVEE)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libgles2 libxkbcommon0 libx11-6 libxext6 \
            libxi6 libxrandr2 libxxf86vm1 libglu1-mesa libsm6 libice6 \
            libxfixes3 libxrender1 libfontconfig1

      - name: Render chunk ${{ matrix.part.chunk }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          blender -b --python "blender/${{ inputs.scene }}.py" -- \
            --frames "${{ inputs.frames }}" \
            --frame-start "${{ matrix.part.start }}" \
            --frame-end "${{ matrix.part.end }}" \
            --res "${{ inputs.res }}" \
            --samples "${{ inputs.samples }}" \
            --engine "${{ inputs.engine }}" \
            ${{ inputs.args }} \
            --out "out/blender/${{ inputs.scene }}/chunk-${{ matrix.part.chunk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: blender-${{ inputs.scene }}-chunk-${{ matrix.part.chunk }}
          path: out/blender/${{ inputs.scene }}/chunk-${{ matrix.part.chunk }}
          if-no-files-found: error
          retention-days: 3

  join:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: blender-${{ inputs.scene }}-chunk-*
          merge-multiple: true
          path: out/blender/${{ inputs.scene }}/frames
      - name: Encode (glow + grade + grain)
        run: |
          ffmpeg -y -loglevel error -framerate 24 \
            -i "out/blender/${{ inputs.scene }}/frames/frame-%04d.png" \
            -vf "split[a][b];[b]gblur=sigma=10[b];[a][b]blend=screen,eq=saturation=0.85:contrast=1.06,vignette=PI/4,colorbalance=bs=0.10:bm=0.04,noise=alls=8:allf=t" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart \
            "out/blender/${{ inputs.scene }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: blender-${{ inputs.scene }}
          path: out/blender/${{ inputs.scene }}.mp4
          if-no-files-found: error
          retention-days: 7
