name: blender

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "scene file under blender/ (without .py)"
        required: true
        default: "neural_net"
      frames:
        description: "number of frames"
        required: true
        default: "144"
      res:
        description: "resolution percentage (100 = 1080p)"
        required: true
        default: "100"
      samples:
        description: "EEVEE TAA samples"
        required: true
        default: "64"
      engine:
        description: "eevee or cycles"
        required: true
        default: "eevee"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender tarball
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/blender
          key: blender-5.2.1

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/blender
          curl -L --retry 3 -o ~/.cache/blender/blender-5.2.1.tar.xz \
            https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz

      - name: Extract Blender
        run: |
          mkdir -p /tmp/blender
          tar -xJf ~/.cache/blender/blender-5.2.1.tar.xz -C /tmp/blender --strip-components=1
          echo "/tmp/blender" >> "$GITHUB_PATH"
          blender --version | head -1

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Render scene
        run: |
          blender -b --python "blender/${{ inputs.scene }}.py" -- \
            --frames "${{ inputs.frames }}" \
            --res "${{ inputs.res }}" \
            --samples "${{ inputs.samples }}" \
            --engine "${{ inputs.engine }}" \
            --out "out/blender/${{ inputs.scene }}"

      - name: Encode (glow + grade + grain)
        run: |
          ffmpeg -y -loglevel error -framerate 24 \
            -i "out/blender/${{ inputs.scene }}/frame-%04d.png" \
            -vf "split[a][b];[b]gblur=sigma=10[b];[a][b]blend=screen,eq=saturation=0.85:contrast=1.06,vignette=PI/4,colorbalance=bs=0.06:ms=0.03:hs=-0.03,noise=alls=8:allf=t" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart \
            "out/blender/${{ inputs.scene }}.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: blender-${{ inputs.scene }}
          path: out/blender/${{ inputs.scene }}.mp4
          if-no-files-found: error
          retention-days: 7
