<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Miniature — L'Illusion de la frontière</title>
<style>
  @font-face { font-family: Archivo; src: url('/studio/fonts/ArchivoBlack.ttf'); }
  @font-face { font-family: Mono; src: url('/studio/fonts/JetBrainsMono.ttf'); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #04070A; }
  .stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #04070A; }
  .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transform: scaleX(-1);
    filter: contrast(1.06) brightness(.86) saturate(.92);
  }
  .grade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg,
      rgba(4,7,10,.97) 0%, rgba(4,7,10,.90) 28%,
      rgba(4,7,10,.55) 52%, rgba(4,7,10,.10) 76%, rgba(4,7,10,.05) 100%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 55% 48%, rgba(0,0,0,0) 30%, rgba(0,0,0,.45) 76%, rgba(0,0,0,.82) 100%);
  }
  .copy { position: absolute; left: 64px; top: 78px; width: 640px; }
  .kicker {
    font-family: Mono; font-size: 14px; letter-spacing: 7px;
    color: rgba(201,196,184,.62); text-transform: uppercase;
  }
  h1 {
    font-family: Archivo; font-size: 106px; line-height: .92;
    letter-spacing: -2px; color: #C9C4B8; margin: 24px 0 0;
    text-shadow: 0 8px 34px rgba(0,0,0,.85);
  }
  h1 .small { font-size: 74px; letter-spacing: -1px; }
  .rule { width: 250px; height: 4px; background: #A81F16; margin: 24px 0 0; }
  .sub {
    font-family: Mono; font-size: 21px; letter-spacing: 5px;
    color: #A1A1A0; margin-top: 20px; text-transform: uppercase;
  }
  .film { position: absolute; left: 64px; bottom: 52px; }
  .film .t { font-family: Mono; font-size: 13px; letter-spacing: 4px; color: rgba(201,196,184,.66); }
  .film .d { font-family: Mono; font-size: 10px; letter-spacing: 3px; color: rgba(201,196,184,.36); margin-top: 6px; }
  .hud {
    position: absolute; top: 34px; right: 52px;
    font-family: Mono; font-size: 11px; letter-spacing: 4px;
    color: rgba(201,196,184,.35); text-align: right;
  }
  .stamp {
    position: absolute; right: 62px; bottom: 58px;
    border: 2px solid rgba(168,31,22,.75); color: #C9331F;
    font-family: Mono; font-size: 13px; letter-spacing: 3px;
    padding: 8px 14px; transform: rotate(-3deg);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="bg" id="bg"></div>
  <div class="grade"></div>
  <div class="vignette"></div>

  <div class="copy">
    <div class="kicker" id="kicker">Dossier 01 — Frontière</div>
    <h1 id="title"></h1>
    <div class="rule"></div>
    <div class="sub" id="sub"></div>
  </div>

  <div class="film">
    <div class="t" id="filmTitle">L'Illusion de la frontière</div>
    <div class="d">Documentaire — 2026</div>
  </div>

  <div class="hud">Bureau des frontières<br>Archive 01</div>
  <div class="stamp" id="stamp">À VOIR</div>
</div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'a';
const SET = {
  a: {
    bg: '/assets/generated/B00-S01.png',
    title: 'HUMAIN<br><span class="small">OU MACHINE&nbsp;?</span>',
    sub: 'La vraie différence',
    stamp: 'À VOIR',
    kicker: 'Dossier 01 — Frontière',
  },
  b: {
    bg: '/assets/generated/B06-S01.png',
    title: 'LA FRONTIÈRE<br><span class="small">N\'EXISTE PAS</span>',
    sub: 'Ce que nous croyons savoir',
    stamp: 'DOSSIER 01',
    kicker: 'Dossier 01 — Frontière',
  },
};
const s = SET[v] || SET.a;
document.getElementById('bg').style.backgroundImage = `url('${s.bg}')`;
document.getElementById('title').innerHTML = s.title;
document.getElementById('sub').textContent = s.sub;
document.getElementById('stamp').textContent = s.stamp;
document.getElementById('kicker').textContent = s.kicker;

const img = new Image();
img.onload = () => {
  document.fonts.ready.then(() => { window.READY = true; });
};
img.onerror = () => { window.READY_ERROR = 'bg failed'; };
img.src = s.bg;
</script>
</body>
</html>
