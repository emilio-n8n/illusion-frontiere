<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Frontière — render</title>
<style>
  @font-face { font-family: JBMono; src: url(/studio/fonts/JetBrainsMono.ttf); }
  @font-face { font-family: ArchivoBlack; src: url(/studio/fonts/ArchivoBlack.ttf); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 1920, H = 1080;
const params = new URLSearchParams(location.search);
const blockId = params.get('block') || 'B00';
const dir = params.get('dir') || 'blocks';
const scale = Math.max(0.1, Math.min(1, Number(params.get('scale') || 1)));
const cv = document.getElementById('c');
cv.width = Math.round(W * scale);
cv.height = Math.round(H * scale);
const ctx = cv.getContext('2d', { alpha: false });

const T = {
  bg: '#04070A',
  ink: '#050607',
  text: '#C6D3CF',
  dim: '#6E827E',
  red: '#A81F16',
  redHot: '#C9331F',
  screen: '#C9C4B8',
};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const out = t => 1 - Math.pow(1 - clamp(t), 3);
const lerp = (a, b, t) => a + (b - a) * t;

let block = null;
let shots = [];
let starts = [];
let total = 0;
let images = [];
let grain = null, vignette = null, grade = null, scan = null;

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function makeGrain() {
  const c = makeCanvas(960, 540), g = c.getContext('2d');
  const id = g.createImageData(960, 540);
  let seed = 0x9e3779b9;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 15 + rnd() * 240;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
    id.data[i + 3] = 24 + rnd() * 38;
  }
  g.putImageData(id, 0, 0);
  return c;
}

function makeVignette() {
  const c = makeCanvas(W, H), g = c.getContext('2d');
  const v = g.createRadialGradient(W * .5, H * .47, H * .18, W * .5, H * .5, H * .82);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(.58, 'rgba(0,0,0,.10)');
  v.addColorStop(1, 'rgba(0,0,0,.66)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  return c;
}

function makeGrade() {
  const c = makeCanvas(W, H), g = c.getContext('2d');
  g.fillStyle = 'rgba(7,17,24,.11)'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'soft-light';
  const lg = g.createLinearGradient(0, 0, W, H);
  lg.addColorStop(0, 'rgba(52,110,132,.26)');
  lg.addColorStop(.52, 'rgba(20,42,52,.08)');
  lg.addColorStop(1, 'rgba(96,38,30,.20)');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'source-over';
  return c;
}

function makeScan() {
  const c = makeCanvas(W, H), g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.025)';
  for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 1);
  return c;
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('image failed: ' + src));
    im.src = src;
  });
}

const isVideoSrc = src => /\.(mp4|webm|mov)(\?|#|$)/i.test(src);

function loadVideo(src) {
  return new Promise((res, rej) => {
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.preload = 'auto';
    v.crossOrigin = 'anonymous';
    const done = () => { cleanup(); res(v); };
    const fail = () => { cleanup(); rej(new Error('video failed: ' + src)); };
    const cleanup = () => {
      v.removeEventListener('loadeddata', done);
      v.removeEventListener('error', fail);
    };
    v.addEventListener('loadeddata', done);
    v.addEventListener('error', fail);
    v.src = src;
  });
}

// media item: {kind: 'img'|'clip', el, w, h}
async function loadMedia(src) {
  if (!isVideoSrc(src)) {
    const im = await loadImage(src);
    return { kind: 'img', el: im, w: im.naturalWidth || im.width, h: im.naturalHeight || im.height };
  }
  const v = await loadVideo(src);
  await seekVideo({ kind: 'clip', el: v }, 0);
  return { kind: 'clip', el: v, w: v.videoWidth, h: v.videoHeight };
}

function seekVideo(media, local) {
  const v = media.el;
  const dur = v.duration;
  if (!Number.isFinite(dur) || dur <= 0) return Promise.resolve();
  const target = clamp(local, 0, Math.max(0, dur - 0.04));
  if (Math.abs(v.currentTime - target) < 1 / 60) return Promise.resolve();
  return new Promise(res => {
    const to = setTimeout(() => { v.removeEventListener('seeked', on); res(); }, 1500);
    const on = () => { clearTimeout(to); v.removeEventListener('seeked', on); res(); };
    v.addEventListener('seeked', on);
    try { v.currentTime = target; } catch { clearTimeout(to); res(); }
  });
}

async function drawShot(media, shot, local, alpha) {
  if (!media) return;
  const el = media.el;
  const w = media.w || 1920, h = media.h || 1080;
  let zoom = 1.04, dx = 0, dy = 0, rot = 0;
  if (media.kind === 'clip') {
    // the clip already moves: no synthetic motion, just cover the frame
    await seekVideo(media, local);
    zoom = 1.03;
  } else {
    const p = clamp(local / Math.max(0.001, shot.duration));
    const e = smooth(p);
    if (shot.camera === 'push-in') zoom = 1.035 + .055 * e;
    else if (shot.camera === 'push-out') zoom = 1.09 - .055 * e;
    else if (shot.camera === 'pan-left') { zoom = 1.075; dx = -30 + 60 * e; }
    else if (shot.camera === 'pan-right') { zoom = 1.075; dx = 30 - 60 * e; }
    else zoom = 1.045;

    // a little life, never a still card
    dx += Math.sin(local * .55 + shot.seed * .01) * 1.8;
    dy += Math.cos(local * .43 + shot.seed * .013) * 1.4;
    rot = Math.sin(local * .21 + shot.seed * .007) * .0009;
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2 + dx, H / 2 + dy);
  ctx.rotate(rot);
  ctx.scale(zoom, zoom);
  const sc = Math.max(W / w, H / h) * 1.03;
  ctx.drawImage(el, -w * sc / 2, -h * sc / 2, w * sc, h * sc);
  ctx.restore();
}

function drawOverlay(shot, local) {
  if (!shot.overlay) return;
  const inA = smooth(clamp((local - .35) / .55));
  const outA = 1 - smooth(clamp((local - shot.duration + .65) / .55));
  const a = inA * outA;
  if (a <= .001) return;

  const text = shot.overlay.toUpperCase();
  ctx.save();
  ctx.globalAlpha = a;

  if (shot.overlayPos === 'center') {
    ctx.textAlign = 'center';
    ctx.font = '600 54px ArchivoBlack';
    ctx.letterSpacing = '6px';
    const tw = ctx.measureText(text).width;
    ctx.fillStyle = T.screen;
    ctx.fillText(text, W / 2, H / 2 + 12);
    ctx.fillStyle = 'rgba(168,31,22,.8)';
    ctx.fillRect(W / 2 - tw / 2, H / 2 + 44, tw, 2);
    ctx.font = '500 14px JBMono';
    ctx.letterSpacing = '6px';
    ctx.fillStyle = T.text;
    ctx.globalAlpha = a * .55;
    ctx.fillText('UN DOCUMENTAIRE SUR LA FRONTIÈRE', W / 2, H / 2 + 88);
    ctx.restore();
    return;
  }

  const x = 120, y = H - 150;
  ctx.fillStyle = T.red;
  ctx.fillRect(x, y - 42, 3, 64);

  ctx.font = '500 23px JBMono';
  ctx.letterSpacing = '5px';
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = T.text;
  ctx.fillText(text, x + 24, y - 4);

  ctx.fillStyle = 'rgba(168,31,22,.65)';
  ctx.fillRect(x + 24, y + 14, Math.min(190, tw), 1);

  if (shot.stamp) {
    ctx.translate(x + 24 + tw / 2, y - 18);
    ctx.rotate(-.028);
    ctx.strokeStyle = 'rgba(168,31,22,.72)';
    ctx.lineWidth = 2;
    ctx.strokeRect(-tw / 2 - 16, -28, tw + 32, 52);
  }
  ctx.restore();
}

function drawSubtitle(text) {
  if (!text) return;
  const maxChars = 88;
  const words = text.split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (t.length > maxChars && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  const shown = lines.slice(0, 3);
  if (!shown.length) return;

  ctx.save();
  ctx.font = '500 22px JBMono';
  ctx.letterSpacing = '0px';
  ctx.textAlign = 'center';
  const lineH = 31;
  const maxW = Math.max(...shown.map(l => ctx.measureText(l).width));
  const y0 = H - 118 - (shown.length - 1) * lineH;
  ctx.fillStyle = 'rgba(4,7,10,.64)';
  ctx.fillRect(W / 2 - maxW / 2 - 24, y0 - 30, maxW + 48, shown.length * lineH + 18);
  ctx.fillStyle = 'rgba(220,228,224,.90)';
  shown.forEach((l, i) => ctx.fillText(l, W / 2, y0 + i * lineH));
  ctx.restore();
}

function motionAlpha(local, m) {
  const inA = smooth(clamp(local / .45));
  const outA = 1 - smooth(clamp((local - m.dur + .5) / .5));
  return inA * outA;
}

function motionPlate(x, y, w, h) {
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, 'rgba(4,7,10,.46)');
  g.addColorStop(1, 'rgba(4,7,10,.18)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
}

function drawMotion(m, local) {
  const a = motionAlpha(local, m);
  if (a <= .001) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.letterSpacing = '0px';

  if (m.type === 'number') {
    const target = parseFloat(String(m.value).replace(/[^\d.]/g, '')) || 0;
    const p = out(clamp(local / 1.1));
    const n = Math.round(target * p);
    const fmt = new Intl.NumberFormat('fr-FR').format(n).replace(/[\u202f\u00a0]/g, ' ');
    const size = m.size || 108;
    ctx.shadowColor = 'rgba(0,0,0,.85)';
    ctx.shadowBlur = 22;
    ctx.fillStyle = T.screen;
    ctx.font = `400 ${size}px ArchivoBlack`;
    ctx.fillText(fmt, m.x, m.y + size);
    ctx.shadowBlur = 0;
    ctx.fillStyle = T.red;
    ctx.fillRect(m.x, m.y + size + 20, 170, 2);
    ctx.font = '500 20px JBMono';
    ctx.letterSpacing = '4px';
    ctx.fillStyle = T.text;
    ctx.fillText(m.label, m.x, m.y + size + 56);
    if (m.sublabel) {
      ctx.globalAlpha = a * .8;
      ctx.font = '500 13px JBMono';
      ctx.letterSpacing = '3px';
      ctx.fillStyle = T.text;
      ctx.fillText(m.sublabel, m.x, m.y + size + 82);
    }
    ctx.restore();
    return;
  }

  if (m.type === 'dots') {
    const total = 160, cols = 20, rows = 8;
    const gridTop = m.y + 170;
    const gridH = m.h - 240;
    const dx = m.w / (cols - 1), dy = gridH / (rows - 1);
    const highlight = Math.floor(total * (m.highlight || .35));
    for (let i = 0; i < total; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      const pp = clamp((local - col * .012 - row * .012) / .8);
      if (pp <= 0) continue;
      const x = m.x + col * dx, y = gridTop + row * dy;
      const r = 2.6 * (.55 + .45 * pp);
      ctx.globalAlpha = a * pp * (i < highlight ? .95 : .42);
      ctx.fillStyle = i < highlight ? T.red : T.screen;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = a;
    ctx.fillStyle = T.screen;
    ctx.font = '400 88px ArchivoBlack';
    ctx.fillText(`${m.value}`, m.x, m.y + 78);
    const nw = ctx.measureText(`${m.value}`).width;
    ctx.font = '500 26px JBMono';
    ctx.letterSpacing = '6px';
    ctx.fillStyle = T.text;
    ctx.fillText(m.unit, m.x + nw + 18, m.y + 76);
    ctx.fillStyle = T.red;
    ctx.fillRect(m.x, m.y + 102, 190, 2);
    ctx.globalAlpha = a * .8;
    ctx.font = '500 14px JBMono';
    ctx.letterSpacing = '3px';
    ctx.fillStyle = T.text;
    ctx.fillText(m.label, m.x, m.y + 134);
    ctx.globalAlpha = a * .55;
    ctx.font = '500 12px JBMono';
    ctx.letterSpacing = '2px';
    ctx.fillStyle = T.dim;
    ctx.fillText(m.legend, m.x, m.y + m.h - 8);
    ctx.restore();
    return;
  }

  if (m.type === 'bars') {
    const max = Math.max(...m.bars.map(b => b.value));
    ctx.fillStyle = T.screen;
    ctx.font = '500 18px JBMono';
    ctx.letterSpacing = '4px';
    ctx.fillText(m.title, m.x, m.y);
    const rowH = 74;
    m.bars.forEach((b, i) => {
      const y = m.y + 40 + i * rowH;
      const p = out(clamp((local - i * .18) / 1.1));
      const w = (b.value / max) * m.w * p;
      ctx.fillStyle = 'rgba(201,196,184,.12)';
      ctx.fillRect(m.x, y + 20, m.w, m.barH);
      ctx.fillStyle = b.color === 'red' ? T.red : 'rgba(143,214,214,.75)';
      ctx.fillRect(m.x, y + 20, Math.max(2, w), m.barH);
      ctx.fillStyle = T.text;
      ctx.font = '500 14px JBMono';
      ctx.letterSpacing = '3px';
      ctx.fillText(b.label, m.x, y + 8);
      ctx.textAlign = 'right';
      ctx.fillStyle = T.screen;
      ctx.font = '400 24px ArchivoBlack';
      ctx.fillText(new Intl.NumberFormat('fr-FR').format(b.value).replace(/[\u202f\u00a0]/g, ' '), m.x + m.w, y + 8);
      ctx.textAlign = 'left';
    });
    ctx.restore();
    return;
  }

  if (m.type === 'brackets') {
    const p = out(clamp(local / .9));
    const len = 34, x = m.x, y = m.y, w = m.w, h = m.h;
    ctx.strokeStyle = 'rgba(201,196,184,.75)';
    ctx.lineWidth = 2;
    const corners = [
      [[x, y + len], [x, y], [x + len, y]],
      [[x + w - len, y], [x + w, y], [x + w, y + len]],
      [[x + w, y + h - len], [x + w, y + h], [x + w - len, y + h]],
      [[x + len, y + h], [x, y + h], [x, y + h - len]],
    ];
    for (const c of corners) {
      ctx.beginPath();
      ctx.moveTo(...c[0]);
      ctx.lineTo(...c[1]);
      ctx.lineTo(...c[2]);
      ctx.stroke();
    }
    ctx.fillStyle = T.red;
    ctx.beginPath();
    ctx.arc(x - 6, y - 6, 3.5 * p, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = T.screen;
    ctx.font = '500 16px JBMono';
    ctx.letterSpacing = '4px';
    ctx.fillText(m.label, x, y - 18);
    if (m.sublabel) {
      ctx.globalAlpha = a * .55;
      ctx.font = '500 11px JBMono';
      ctx.letterSpacing = '3px';
      ctx.fillStyle = T.dim;
      ctx.fillText(m.sublabel, x, y + h + 24);
    }
    ctx.restore();
    return;
  }

  if (m.type === 'timeline') {
    const p = out(clamp(local / 1.4));
    const y = m.y;
    ctx.fillStyle = T.screen;
    ctx.font = '500 17px JBMono';
    ctx.letterSpacing = '4px';
    ctx.fillText(m.title, m.x, y - 42);
    ctx.strokeStyle = 'rgba(201,196,184,.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(m.x, y);
    ctx.lineTo(m.x + m.w * p, y);
    ctx.stroke();
    const n = m.points.length;
    m.points.forEach((pt, i) => {
      const px = m.x + (i / (n - 1)) * m.w;
      const pp = clamp((local - .5 - i * .16) / .4);
      if (pp <= 0) return;
      ctx.fillStyle = T.red;
      ctx.beginPath();
      ctx.arc(px, y, 4.5 * pp, 0, Math.PI * 2);
      ctx.fill();
      ctx.textAlign = 'center';
      ctx.fillStyle = T.screen;
      ctx.font = '400 26px ArchivoBlack';
      ctx.fillText(pt.year, px, y - 22);
      ctx.globalAlpha = a * .7;
      ctx.fillStyle = T.text;
      ctx.font = '500 12px JBMono';
      ctx.letterSpacing = '3px';
      ctx.fillText(pt.label, px, y + 30);
      ctx.globalAlpha = a;
    });
    ctx.restore();
    return;
  }

  if (m.type === 'redact') {
    const p = out(clamp(local / 1.1));
    ctx.fillStyle = T.text;
    ctx.font = '500 13px JBMono';
    ctx.letterSpacing = '4px';
    ctx.globalAlpha = a * .55;
    ctx.fillText(m.label, m.x, m.y - 18);
    ctx.globalAlpha = a;
    const bars = [
      [0, 0.82], [1, 0.56], [2, 0.72], [3, 0.40],
    ];
    ctx.fillStyle = 'rgba(3,5,7,.92)';
    bars.forEach(([i, frac], idx) => {
      const bp = out(clamp((local - idx * .10) / .9));
      ctx.fillRect(m.x, m.y + i * 58, m.w * frac * bp, 18);
    });
    const sp = out(clamp((local - .5) / .8));
    ctx.save();
    ctx.translate(m.x + m.w * .48, m.y + m.h + 10);
    ctx.rotate(-.028);
    ctx.globalAlpha = a * sp;
    ctx.strokeStyle = 'rgba(168,31,22,.85)';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(-250, -30, 500, 58);
    ctx.fillStyle = T.red;
    ctx.font = '400 26px ArchivoBlack';
    ctx.textAlign = 'center';
    ctx.fillText(m.stamp, 0, 8);
    ctx.restore();
    ctx.restore();
    return;
  }

  if (m.type === 'frontier') {
    const p = out(clamp(local / 1.6));
    const x = W / 2;
    ctx.strokeStyle = 'rgba(201,196,184,.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 9]);
    ctx.beginPath();
    ctx.moveTo(x, 120);
    ctx.lineTo(x, 120 + 820 * p);
    ctx.stroke();
    ctx.setLineDash([]);
    const rp = out(clamp((local - 1.2) / 1.6));
    ctx.strokeStyle = 'rgba(168,31,22,.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, 120);
    ctx.lineTo(x, 120 + 820 * rp);
    ctx.stroke();
    ctx.fillStyle = T.text;
    ctx.font = '500 15px JBMono';
    ctx.letterSpacing = '5px';
    ctx.textAlign = 'right';
    ctx.fillText('NOUS', x - 28, 150);
    ctx.textAlign = 'left';
    ctx.fillText('EUX', x + 28, 150);
    ctx.textAlign = 'center';
    ctx.globalAlpha = a * .55;
    ctx.fillStyle = T.red;
    ctx.font = '500 13px JBMono';
    ctx.fillText(m.label, x, 1000);
    ctx.restore();
    return;
  }

  if (m.type === 'diagram') {
    const p = out(clamp(local / 1.2));
    const nodes = [
      { x: m.x, y: m.y, label: 'EXPÉRIENCE', color: T.screen },
      { x: m.x + m.w, y: m.y + m.h / 2, label: 'ERREUR', color: T.red },
      { x: m.x, y: m.y + m.h, label: 'AJUSTEMENT', color: T.screen },
    ];
    ctx.fillStyle = T.screen;
    ctx.font = '500 15px JBMono';
    ctx.letterSpacing = '4px';
    ctx.fillText(m.title, m.x, m.y - 28);
    ctx.strokeStyle = 'rgba(201,196,184,.45)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([5, 7]);
    for (let i = 0; i < 3; i++) {
      const a1 = nodes[i], b1 = nodes[(i + 1) % 3];
      ctx.beginPath();
      ctx.moveTo(a1.x, a1.y);
      ctx.lineTo(lerp(a1.x, b1.x, p), lerp(a1.y, b1.y, p));
      ctx.stroke();
    }
    ctx.setLineDash([]);
    nodes.forEach((n, i) => {
      ctx.fillStyle = n.color;
      ctx.beginPath();
      ctx.arc(n.x, n.y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '500 13px JBMono';
      ctx.letterSpacing = '3px';
      ctx.textAlign = i === 1 ? 'left' : 'right';
      ctx.fillText(n.label, n.x + (i === 1 ? 16 : -16), n.y + 4);
    });
    ctx.restore();
    return;
  }

  ctx.restore();
}

function drawMotions(t) {
  if (!block.motions || !block.motions.length) return;
  for (const m of block.motions) {
    const local = t - m.at;
    if (local < 0 || local > m.dur) continue;
    drawMotion(m, local);
  }
}

function drawHud(t) {
  ctx.save();
  ctx.font = '500 13px JBMono';
  ctx.letterSpacing = '5px';
  ctx.fillStyle = T.text;
  ctx.globalAlpha = .30;
  ctx.textAlign = 'left';
  ctx.fillText('BUREAU DES FRONTIÈRES', 120, 78);
  ctx.globalAlpha = .20;
  ctx.textAlign = 'right';
  ctx.fillText('DOSSIER 01 — FRONTIÈRE', W - 120, 78);

  ctx.globalAlpha = .24;
  ctx.textAlign = 'right';
  ctx.letterSpacing = '3px';
  ctx.fillText(`${block.id} / ${block.title.toUpperCase()}`, W - 120, H - 70);
  ctx.globalAlpha = .45;
  ctx.fillStyle = T.redHot;
  ctx.fillRect(W - 330, H - 56, 210, 1);
  ctx.restore();
}

function drawDust(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 38; i++) {
    const px = ((i * 173.3 + t * (7 + (i % 5) * 1.7)) % (W + 120)) - 60;
    const py = ((i * 311.7 + Math.sin(t * .25 + i) * 24 + t * 2.2) % (H + 80)) - 40;
    const r = .6 + (i % 4) * .45;
    const a = .035 + .055 * Math.abs(Math.sin(t * .6 + i * 1.7));
    ctx.fillStyle = `rgba(190,225,220,${a})`;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

async function draw(t) {
  t = clamp(t, 0, Math.max(0, total - .0001));
  let i = 0;
  while (i < shots.length - 1 && t >= starts[i] + shots[i].duration) i++;
  const shot = shots[i];
  const local = t - starts[i];

  ctx.save();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = T.bg;
  ctx.fillRect(0, 0, W, H);

  // a dissolve only where the block asks for one
  if (i > 0 && shot.transition === 'dissolve' && local < .5) {
    await drawShot(images[i - 1], shots[i - 1], shots[i - 1].duration, 1);
    await drawShot(images[i], shot, local, smooth(local / .5));
  } else {
    await drawShot(images[i], shot, local, 1);
  }

  ctx.drawImage(grade, 0, 0);
  ctx.drawImage(vignette, 0, 0);
  drawMotions(t);
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = .11;
  const ox = (t * 37) % 40, oy = (t * 53) % 40;
  ctx.drawImage(grain, -ox, -oy, W + 80, H + 80);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  ctx.drawImage(scan, 0, 0);
  drawDust(t);
  drawOverlay(shot, local);
  drawSubtitle(block.subtitle);
  drawHud(t);

  // block-level fade in/out
  const fi = block.fadeIn || 0, fo = block.fadeOut || 0;
  let black = 0;
  if (fi > 0 && t < fi) black = 1 - smooth(t / fi);
  if (fo > 0 && t > total - fo) black = Math.max(black, smooth((t - (total - fo)) / fo));
  if (black > 0) {
    ctx.fillStyle = `rgba(0,0,0,${black})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

async function boot() {
  block = await fetch(`/studio/${dir}/${blockId}.json`).then(r => {
    if (!r.ok) throw new Error(`block ${blockId}: HTTP ${r.status}`);
    return r.json();
  });
  shots = block.shots;
  starts = [];
  let acc = 0;
  for (const s of shots) { starts.push(acc); acc += Number(s.duration); }
  total = acc;

  images = await Promise.all(shots.map(s => loadMedia(s.src)));
  grain = makeGrain();
  vignette = makeVignette();
  grade = makeGrade();
  scan = makeScan();

  await Promise.all([
    document.fonts.load('16px JBMono'),
    document.fonts.load('16px ArchivoBlack'),
    document.fonts.ready,
  ]);

  window.SPEC = { duration: total, fps: block.fps || 24, width: W, height: H };
  window.setT = draw;
  await draw(0);
  window.READY = true;
}

boot().catch(err => {
  window.READY_ERROR = String(err && err.stack || err);
  console.error(err);
});
</script>
</body>
</html>
